# Remote A2A Proxy for Solasland micro-A2A service

log:
  stdout_log_level: INFO
  log_file_level: DEBUG
  log_file: a2a_remote_proxy.log

!include ../shared_config.yaml

apps:
  - name: solasland_remote_proxy_app
    app_base_path: .
    app_module: solace_agent_mesh.agent.proxies.a2a.app
    broker:
      <<: *broker_connection
    app_config:
      namespace: ${NAMESPACE}
      artifact_service:
        type: filesystem
        base_path: /tmp/samv2
        artifact_scope: namespace
      artifact_handling_mode: reference
      discovery_interval_seconds: 10
      tools:
        - group_name: artifact_management
          tool_type: builtin-group
      proxied_agents:
        - name: solasland_manager_001
          url: http://127.0.0.1:9100/agents/solasland_manager_001
          agent_card_path: /v1/card
          use_agent_card_url: true
        - name: solasland_manager_002
          url: http://127.0.0.1:9100/agents/solasland_manager_002
          agent_card_path: /v1/card
          use_agent_card_url: true
