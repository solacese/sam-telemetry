<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Bank  -  Cost Analysis &amp; ROI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    /* ================================================================
       Solace colour system
       ================================================================ */
    :root {
      --sol-bg:       #021b2f;
      --sol-surface:  #01374e;
      --sol-surface2: #014968;
      --sol-header:   #03223b;
      --sol-border:   #0a4060;
      --sol-border-l: #0d5579;
      --sol-green:    #00c895;
      --sol-green-bg: rgba(0,200,149,.10);
      --sol-green-20: rgba(0,200,149,.20);
      --sol-green-40: rgba(0,200,149,.40);
      --sol-text:     #e6eff2;
      --sol-muted:    #b1b9c0;
      --sol-dim:      #536574;
      --sol-card:     #012e45;
      --sol-card-hov: #013a56;
      /* platforms */
      --databricks: #ff3621; --databricks-bg: rgba(255,54,33,.12);
      --salesforce: #00a1e0; --salesforce-bg: rgba(0,161,224,.12);
      --mistral:    #f97316; --mistral-bg:    rgba(249,115,22,.12);
      --claude:     #d4a574; --claude-bg:     rgba(212,165,116,.12);
      --orch:       #00c895; --orch-bg:       rgba(0,200,149,.12);
      /* ROI */
      --roi-green:  #00c895;
      --roi-amber:  #f59e0b;
      --roi-red:    #ef4444;
      --roi-blue:   #38bdf8;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--sol-bg); color: var(--sol-text); font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: var(--sol-green); text-decoration: none; }

    /* ---- layout ---- */
    .app { display: flex; flex-direction: column; height: 100vh; }

    /* ---- topbar ---- */
    .topbar {
      background: var(--sol-header); border-bottom: 1px solid var(--sol-border);
      padding: 0 24px; height: 56px; display: flex; align-items: center; gap: 16px; flex-shrink: 0;
      position: relative;
    }
    .topbar::after {
      content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent 10%, var(--sol-green) 50%, transparent 90%);
      opacity: .6;
    }
    .logo-block { display: flex; align-items: center; gap: 10px; }
    .logo-text { font-size: 14px; font-weight: 700; color: var(--sol-green); letter-spacing: .02em; }
    .logo-sep { width: 1px; height: 24px; background: var(--sol-border-l); margin: 0 6px; }
    .title-block h1 { font-size: 15px; font-weight: 700; color: var(--sol-text); }
    .title-block .sub { font-size: 10px; color: var(--sol-dim); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
    .topbar-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .topbar-right a {
      font-size: 12px; color: var(--sol-muted); padding: 5px 10px; border-radius: 6px;
      transition: all .12s; font-weight: 500; border: 1px solid transparent;
    }
    .topbar-right a:hover { color: var(--sol-green); border-color: var(--sol-border); background: rgba(0,200,149,.05); }
    .topbar-right a.active { color: var(--sol-green); border-color: var(--sol-green); background: var(--sol-green-bg); font-weight: 600; }
    .live-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 14px; font-size: 11px; font-weight: 600;
      background: var(--sol-green-bg); border: 1px solid var(--sol-green-20); color: var(--sol-green);
    }
    .live-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--sol-green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }

    .main { display: flex; flex: 1; min-height: 0; }

    /* ---- sidebar ---- */
    .sidebar {
      width: 250px; flex-shrink: 0; background: var(--sol-surface);
      border-right: 1px solid var(--sol-border); display: flex; flex-direction: column; overflow-y: auto;
    }
    .sb-hdr { padding: 14px 16px 10px; border-bottom: 1px solid var(--sol-border); }
    .sb-hdr h3 { font-size: 10px; font-weight: 700; color: var(--sol-dim); letter-spacing: .1em; text-transform: uppercase; }
    .sb-body { flex: 1; padding: 6px 0; overflow-y: auto; }
    .sb-sec { padding: 12px 16px 4px; font-size: 9px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--sol-dim); }
    .sb-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; border: none; background: none;
      color: var(--sol-muted); font-size: 12px; font-weight: 500;
      cursor: pointer; width: 100%; text-align: left; transition: all .12s; position: relative;
      font-family: inherit;
    }
    .sb-btn:hover { background: rgba(0,200,149,.04); color: var(--sol-text); }
    .sb-btn.active { background: var(--sol-surface2); color: var(--sol-green); font-weight: 600; }
    .sb-btn.active::before {
      content: ''; position: absolute; left: 0; top: 3px; bottom: 3px; width: 3px;
      background: var(--sol-green); border-radius: 0 2px 2px 0;
    }
    .sb-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

    /* sidebar mini bars */
    .sb-bar-row { display: flex; align-items: center; gap: 8px; padding: 6px 16px; }
    .sb-bar-label { font-size: 11px; color: var(--sol-muted); width: 80px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sb-bar-track { flex: 1; height: 6px; background: rgba(255,255,255,.04); border-radius: 3px; overflow: hidden; }
    .sb-bar-fill { height: 100%; border-radius: 3px; transition: width .4s; }
    .sb-bar-val { font-size: 10px; color: var(--sol-dim); font-weight: 600; width: 56px; text-align: right; flex-shrink: 0; }

    /* sidebar roi summary */
    .sb-roi-summary {
      margin: 8px 12px; padding: 12px; border-radius: 8px;
      background: rgba(0,200,149,.06); border: 1px solid var(--sol-green-20);
    }
    .sb-roi-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; }
    .sb-roi-label { font-size: 10px; color: var(--sol-muted); }
    .sb-roi-val { font-size: 12px; font-weight: 700; color: var(--sol-green); }
    .sb-roi-val.amber { color: var(--roi-amber); }
    .sb-roi-val.red { color: var(--roi-red); }

    /* ---- content ---- */
    .content { flex: 1; overflow-y: auto; padding: 20px 24px; }

    /* ---- hero stats ---- */
    .hero-stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 24px; }
    .stat-card {
      background: var(--sol-card); border: 1px solid var(--sol-border); border-radius: 10px;
      padding: 16px 18px; position: relative; overflow: hidden;
    }
    .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
    .stat-card.c-green::before  { background: var(--sol-green); }
    .stat-card.c-amber::before  { background: var(--roi-amber); }
    .stat-card.c-blue::before   { background: var(--roi-blue); }
    .stat-card.c-roi::before    { background: linear-gradient(90deg, var(--sol-green), var(--roi-blue)); }
    .stat-val { font-size: 28px; font-weight: 800; line-height: 1; letter-spacing: -.5px; }
    .stat-lbl { font-size: 10px; color: var(--sol-muted); margin-top: 4px; font-weight: 500; }
    .stat-sub { font-size: 9px; color: var(--sol-dim); margin-top: 2px; }

    /* ---- section headers ---- */
    .section { margin-bottom: 28px; }
    .section-hdr {
      display: flex; align-items: center; gap: 12px;
      padding-bottom: 10px; margin-bottom: 16px; border-bottom: 1px solid var(--sol-border);
    }
    .section-title { font-size: 16px; font-weight: 700; }
    .section-sub { font-size: 11px; color: var(--sol-dim); }
    .section-line { flex: 1; height: 1px; background: var(--sol-border); }

    /* ================================================================
       Comparison Panel
       ================================================================ */
    .comparison {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0;
      border-radius: 14px; overflow: hidden; margin-bottom: 28px;
      border: 1px solid var(--sol-border);
      position: relative;
    }
    .comparison::before {
      content: 'VS'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 10; background: var(--sol-header); color: var(--sol-muted);
      width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800; border: 2px solid var(--sol-border-l); letter-spacing: .05em;
    }
    .comp-side { padding: 28px 32px; position: relative; }
    .comp-side.without {
      background: linear-gradient(135deg, rgba(239,68,68,.04) 0%, var(--sol-card) 100%);
      border-right: 1px solid var(--sol-border);
    }
    .comp-side.without::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--roi-red), rgba(239,68,68,.3));
    }
    .comp-side.with {
      background: linear-gradient(135deg, rgba(0,200,149,.04) 0%, var(--sol-card) 100%);
    }
    .comp-side.with::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--sol-green), rgba(0,200,149,.3));
    }
    .comp-title {
      font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
      margin-bottom: 20px; display: flex; align-items: center; gap: 8px;
    }
    .comp-title .icon { font-size: 16px; }
    .comp-title.red { color: var(--roi-red); }
    .comp-title.green { color: var(--sol-green); }

    .comp-line {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.04);
    }
    .comp-line:last-child { border-bottom: none; }
    .comp-line-desc { font-size: 12px; color: var(--sol-muted); flex: 1; }
    .comp-line-detail { font-size: 10px; color: var(--sol-dim); margin-top: 1px; }
    .comp-line-cost { font-size: 15px; font-weight: 700; white-space: nowrap; margin-left: 16px; }
    .comp-line-cost.red { color: var(--roi-red); }
    .comp-line-cost.green { color: var(--sol-green); }
    .comp-line-cost.included { color: var(--sol-green); font-size: 11px; font-weight: 600; opacity: .7; }

    .comp-total {
      margin-top: 16px; padding: 14px 0 0; border-top: 2px solid;
      display: flex; justify-content: space-between; align-items: center;
    }
    .comp-total.red { border-top-color: rgba(239,68,68,.3); }
    .comp-total.green { border-top-color: rgba(0,200,149,.3); }
    .comp-total-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
    .comp-total-val { font-size: 28px; font-weight: 900; }
    .comp-total-val.red { color: var(--roi-red); }
    .comp-total-val.green { color: var(--sol-green); }

    /* savings bar */
    .savings-bar {
      margin-top: 0; padding: 20px 32px;
      background: linear-gradient(90deg, rgba(0,200,149,.08), rgba(0,200,149,.02));
      border-top: 1px solid var(--sol-border);
      display: flex; align-items: center; gap: 20px; grid-column: 1 / -1;
    }
    .savings-label { font-size: 14px; font-weight: 700; color: var(--sol-green); white-space: nowrap; }
    .savings-track {
      flex: 1; height: 28px; background: rgba(239,68,68,.12); border-radius: 6px;
      overflow: hidden; position: relative;
    }
    .savings-fill {
      height: 100%; border-radius: 6px;
      background: linear-gradient(90deg, var(--sol-green), #00e6a8);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800; color: #021b2f; transition: width .8s ease-out;
    }
    .savings-amount { font-size: 22px; font-weight: 900; color: var(--sol-green); white-space: nowrap; }

    /* ---- horizontal bars ---- */
    .h-bar-group { display: flex; flex-direction: column; gap: 12px; }
    .h-bar-item { display: flex; align-items: center; gap: 12px; }
    .h-bar-label { width: 140px; flex-shrink: 0; }
    .h-bar-label-name { font-size: 13px; font-weight: 600; }
    .h-bar-label-sub { font-size: 10px; color: var(--sol-dim); }
    .h-bar-track {
      flex: 1; height: 32px; background: rgba(255,255,255,.03); border-radius: 6px;
      overflow: hidden; position: relative;
    }
    .h-bar-fill {
      height: 100%; border-radius: 6px; display: flex; align-items: center; padding: 0 12px;
      font-size: 11px; font-weight: 700; color: #fff; transition: width .6s ease-out;
      min-width: 50px;
    }
    .h-bar-fill.databricks { background: linear-gradient(90deg, var(--databricks), rgba(255,54,33,.7)); }
    .h-bar-fill.salesforce { background: linear-gradient(90deg, var(--salesforce), rgba(0,161,224,.7)); }
    .h-bar-fill.mistral    { background: linear-gradient(90deg, var(--mistral), rgba(249,115,22,.7)); }
    .h-bar-fill.claude     { background: linear-gradient(90deg, var(--claude), rgba(212,165,116,.7)); }
    .h-bar-fill.green      { background: linear-gradient(90deg, var(--sol-green), rgba(0,200,149,.7)); }
    .h-bar-fill.blue       { background: linear-gradient(90deg, var(--roi-blue), rgba(56,189,248,.7)); }
    .h-bar-fill.amber      { background: linear-gradient(90deg, var(--roi-amber), rgba(245,158,11,.7)); }
    .h-bar-meta { width: 100px; flex-shrink: 0; text-align: right; }
    .h-bar-cost { font-size: 14px; font-weight: 700; }
    .h-bar-pct { font-size: 10px; color: var(--sol-dim); }
    .platform-badge {
      display: inline-block; font-size: 9px; padding: 2px 6px; border-radius: 4px;
      font-weight: 700; letter-spacing: .03em; text-transform: uppercase; margin-left: 4px;
    }
    .platform-badge.databricks { background: var(--databricks-bg); color: var(--databricks); }
    .platform-badge.salesforce { background: var(--salesforce-bg); color: var(--salesforce); }
    .platform-badge.mistral    { background: var(--mistral-bg); color: var(--mistral); }
    .platform-badge.claude     { background: var(--claude-bg); color: var(--claude); }

    /* ---- table ---- */
    .util-table { width: 100%; border-collapse: collapse; }
    .util-table th {
      text-align: left; font-size: 9px; font-weight: 700; color: var(--sol-dim);
      text-transform: uppercase; letter-spacing: .08em; padding: 8px 10px;
      border-bottom: 1px solid var(--sol-border);
    }
    .util-table td {
      font-size: 12px; padding: 9px 10px; border-bottom: 1px solid rgba(255,255,255,.03);
      vertical-align: middle;
    }
    .util-table tr:hover td { background: rgba(0,200,149,.02); }
    .util-table .mono { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 10px; color: var(--sol-dim); }
    .badge-status {
      display: inline-block; font-size: 9px; padding: 2px 8px; border-radius: 10px; font-weight: 700;
    }
    .badge-status.amber { background: rgba(245,158,11,.12); color: var(--roi-amber); border: 1px solid rgba(245,158,11,.2); }
    .badge-status.green { background: var(--sol-green-bg); color: var(--sol-green); border: 1px solid var(--sol-green-20); }

    /* ---- trend chart ---- */
    .trend-chart {
      display: flex; align-items: flex-end; gap: 12px; height: 200px;
      padding: 0 20px 30px; position: relative;
    }
    .trend-chart::after {
      content: ''; position: absolute; bottom: 30px; left: 20px; right: 20px;
      height: 1px; background: var(--sol-border);
    }
    .trend-bar-group {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0;
      position: relative; z-index: 1;
    }
    .trend-bar-stack {
      width: 100%; max-width: 70px; border-radius: 6px 6px 0 0; overflow: hidden;
      display: flex; flex-direction: column-reverse;
    }
    .trend-seg { transition: height .5s ease-out; }
    .trend-seg.compute { background: var(--roi-blue); }
    .trend-seg.tokens  { background: var(--roi-amber); }
    .trend-seg.gov     { background: var(--sol-green); }
    .trend-val { font-size: 11px; font-weight: 700; color: var(--sol-text); margin-bottom: 4px; }
    .trend-month { font-size: 10px; color: var(--sol-dim); margin-top: 6px; font-weight: 600; }
    .trend-legend { display: flex; gap: 18px; justify-content: center; margin-top: 12px; }
    .trend-legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--sol-muted); }
    .trend-legend-dot { width: 10px; height: 10px; border-radius: 3px; }

    /* ---- ROI summary ---- */
    .roi-summary {
      display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: 0; align-items: center;
      background: linear-gradient(135deg, rgba(0,200,149,.06), var(--sol-card));
      border: 1px solid var(--sol-green-20); border-radius: 14px;
      padding: 28px 36px; position: relative; overflow: hidden;
    }
    .roi-summary::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--sol-green), var(--roi-blue), var(--sol-green));
    }
    .roi-col { text-align: center; }
    .roi-col-label { font-size: 11px; color: var(--sol-muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; margin-bottom: 6px; }
    .roi-col-val { font-size: 32px; font-weight: 900; line-height: 1; }
    .roi-col-sub { font-size: 10px; color: var(--sol-dim); margin-top: 4px; }
    .roi-arrow { font-size: 24px; color: var(--sol-green); padding: 0 12px; opacity: .4; }
    .roi-progress { grid-column: 1 / -1; margin-top: 20px; }
    .roi-progress-label { font-size: 10px; color: var(--sol-muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
    .roi-progress-track { height: 8px; background: rgba(255,255,255,.06); border-radius: 4px; overflow: hidden; }
    .roi-progress-fill {
      height: 100%; border-radius: 4px;
      background: linear-gradient(90deg, var(--sol-green), #00e6a8);
      transition: width 1s ease-out;
    }

    /* ---- loading ---- */
    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px; color: var(--sol-muted); font-size: 13px; gap: 14px; }
    .spinner { width: 26px; height: 26px; border: 3px solid var(--sol-border); border-top-color: var(--sol-green); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,200,149,.15); border-radius: 3px; }

    @media (max-width: 1200px) { .hero-stats { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 900px) { .sidebar { width: 200px; } .hero-stats { grid-template-columns: repeat(3, 1fr); } .comparison { grid-template-columns: 1fr; } }
    @media (max-width: 600px) { .sidebar { display: none; } .hero-stats { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo-block">
      <span class="logo-text">solace.</span>
    </div>
    <div class="logo-sep"></div>
    <div class="title-block">
      <h1>Your Bank  -  Cost Analysis &amp; ROI</h1>
      <span class="sub">Financial Impact and Platform Comparison</span>
    </div>
    <div class="topbar-right">
      <span class="live-badge"><span class="dot"></span> 2,000 agents live</span>
      <a href="agents.html">Agents</a>
      <a href="governance.html">Governance</a>
      <a href="workflows.html">Workflows</a>
      <a href="cost.html" class="active">Cost</a>
      <a href="observability.html">Observability</a>
    </div>
  </div>
  <div class="main">
    <div class="sidebar" id="sidebar"></div>
    <div class="content" id="content">
      <div class="loading"><div class="spinner"></div>Computing cost analysis for 2,000 agents...</div>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ================================================================
  // Seeded RNG
  // ================================================================
  function seededRand(seed) {
    let s = seed;
    return () => { s = (s * 16807 + 0) % 2147483647; return (s - 1) / 2147483646; };
  }

  function hashStr(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
    return Math.abs(h) + 1;
  }

  // ================================================================
  // Your Bank Agent Topology  -  2,000 agents
  // ================================================================
  const DOMAINS = {
    cib:    { label: 'CIB', full: 'Corporate & Investment Banking', platform: 'databricks', color: 'var(--databricks)' },
    retail: { label: 'Retail', full: 'Retail Banking', platform: 'salesforce', color: 'var(--salesforce)' },
    risk:   { label: 'Risk', full: 'Risk & Compliance', platform: 'mistral', color: 'var(--mistral)' },
    it_ops: { label: 'IT & Ops', full: 'IT & Operations', platform: 'claude', color: 'var(--claude)' },
  };

  const PLAT_LABELS = {
    databricks: 'Databricks',
    salesforce: 'Salesforce',
    mistral: 'Mistral AI',
    claude: 'Claude (Anthropic)',
    orch: 'Solace Mesh',
  };

  const AGENTS = [];

  // Orchestrator
  AGENTS.push({
    id: 'agent_orchestrator',
    name: 'Your Bank Orchestrator',
    domain: 'orchestrator',
    platform: 'orch',
    role: 'orchestrator',
    agentType: 'Orchestrator',
  });

  // Heads (4)
  const HEAD_DEFS = [
    { id: 'agent_head_cib', name: 'Head CIB', domain: 'cib', platform: 'databricks' },
    { id: 'agent_head_retail', name: 'Head Retail', domain: 'retail', platform: 'salesforce' },
    { id: 'agent_head_risk', name: 'Head Risk', domain: 'risk', platform: 'mistral' },
    { id: 'agent_head_it_ops', name: 'Head IT & Ops', domain: 'it_ops', platform: 'claude' },
  ];
  HEAD_DEFS.forEach(h => {
    AGENTS.push({ ...h, role: 'head', agentType: 'Domain Head' });
  });

  // Specialists (16, 4 per domain)
  const SPEC_DEFS = [
    // CIB  -  Databricks
    { id: 'agent_cib_trade_analytics', name: 'Trade Analytics', domain: 'cib', platform: 'databricks', agentType: 'Trade Analytics' },
    { id: 'agent_cib_market_risk', name: 'Market Risk', domain: 'cib', platform: 'databricks', agentType: 'Market Risk' },
    { id: 'agent_cib_prime_services', name: 'Prime Services', domain: 'cib', platform: 'databricks', agentType: 'Prime Services' },
    { id: 'agent_cib_compliance', name: 'CIB Compliance', domain: 'cib', platform: 'databricks', agentType: 'Compliance' },
    // Retail  -  Salesforce
    { id: 'agent_retail_crm', name: 'Retail CRM', domain: 'retail', platform: 'salesforce', agentType: 'CRM' },
    { id: 'agent_retail_credit', name: 'Credit Scoring', domain: 'retail', platform: 'salesforce', agentType: 'Credit Scoring' },
    { id: 'agent_retail_onboarding', name: 'Client Onboarding', domain: 'retail', platform: 'salesforce', agentType: 'Onboarding' },
    { id: 'agent_retail_support', name: 'Client Support', domain: 'retail', platform: 'salesforce', agentType: 'Support' },
    // Risk  -  Mistral
    { id: 'agent_risk_credit_model', name: 'Credit Model', domain: 'risk', platform: 'mistral', agentType: 'Modeling' },
    { id: 'agent_risk_fraud', name: 'Fraud Detection', domain: 'risk', platform: 'mistral', agentType: 'Anti-Fraud' },
    { id: 'agent_risk_aml', name: 'AML/CFT', domain: 'risk', platform: 'mistral', agentType: 'AML' },
    { id: 'agent_risk_stress_test', name: 'Stress Testing', domain: 'risk', platform: 'mistral', agentType: 'Stress Test' },
    // IT & Ops  -  Claude
    { id: 'agent_it_incident', name: 'Incident Management', domain: 'it_ops', platform: 'claude', agentType: 'Incidents' },
    { id: 'agent_it_deploy', name: 'CI/CD Deployment', domain: 'it_ops', platform: 'claude', agentType: 'Deployment' },
    { id: 'agent_it_monitoring', name: 'Infra Monitoring', domain: 'it_ops', platform: 'claude', agentType: 'Monitoring' },
    { id: 'agent_it_security', name: 'IT Security', domain: 'it_ops', platform: 'claude', agentType: 'Security' },
  ];
  SPEC_DEFS.forEach(s => {
    AGENTS.push({ ...s, role: 'specialist' });
  });

  // Scale to 2,000 agents: generate additional specialists per domain
  const domainKeys = ['cib', 'retail', 'risk', 'it_ops'];
  const domainPlatforms = { cib: 'databricks', retail: 'salesforce', risk: 'mistral', it_ops: 'claude' };
  const domainTypes = {
    cib: ['Trade Analytics','Market Risk','Prime Services','Compliance','Structuring','Execution','Research','Settlement'],
    retail: ['CRM','Credit Scoring','Onboarding','Support','Mortgage','Upsell','Payments','Scheduling'],
    risk: ['Modeling','Anti-Fraud','AML','Stress Test','Sanctions','Regulatory','Validation','Monitoring'],
    it_ops: ['Incidents','Deployment','Monitoring','Security','Backup','Access','Cost Opt','Documentation'],
  };
  let extraId = 100;
  const targetTotal = 2000;
  const remaining = targetTotal - AGENTS.length;
  const perDomain = Math.floor(remaining / 4);
  for (const dk of domainKeys) {
    const types = domainTypes[dk];
    const plat = domainPlatforms[dk];
    for (let i = 0; i < perDomain; i++) {
      const t = types[i % types.length];
      const inst = Math.floor(i / types.length) + 1;
      AGENTS.push({
        id: `agent_${dk}_${String(extraId++).padStart(4,'0')}`,
        name: `${t} #${inst}`,
        domain: dk,
        platform: plat,
        role: 'specialist',
        agentType: t,
      });
    }
  }

  // ================================================================
  // Generate cost data per agent (seeded)
  // ================================================================
  function generateAgentCosts(agent) {
    const rng = seededRand(hashStr(agent.id));
    let cost, exec, tokens, successRate;

    if (agent.role === 'orchestrator') {
      cost = Math.round(2500 + rng() * 1500);
      exec = Math.round(8000 + rng() * 4000);
      tokens = Math.round(exec * (400 + rng() * 300));
      successRate = Math.round(9500 + rng() * 500) / 100;
    } else if (agent.role === 'head') {
      cost = Math.round(800 + rng() * 700);
      exec = Math.round(2000 + rng() * 3000);
      tokens = Math.round(exec * (250 + rng() * 250));
      successRate = Math.round(9200 + rng() * 800) / 100;
    } else {
      cost = Math.round(50 + rng() * 350);
      exec = Math.round(200 + rng() * 1800);
      tokens = Math.round(exec * (100 + rng() * 200));
      successRate = Math.round(8800 + rng() * 1200) / 100;
    }

    const costPerExec = exec > 0 ? cost / exec : 0;
    const efficiency = successRate >= 97 ? 'Excellent' : successRate >= 93 ? 'Good' : 'Fair';

    return { cost, exec, tokens, successRate, costPerExec, efficiency };
  }

  // Attach costs
  AGENTS.forEach(a => { a.costs = generateAgentCosts(a); });

  // ================================================================
  // Aggregation helpers
  // ================================================================
  function aggDomain(domain) {
    const da = AGENTS.filter(a => a.domain === domain);
    let cost = 0, exec = 0, tokens = 0;
    da.forEach(a => { cost += a.costs.cost; exec += a.costs.exec; tokens += a.costs.tokens; });
    return { cost, exec, tokens, count: da.length };
  }

  function aggPlatform(platform) {
    const pa = AGENTS.filter(a => a.platform === platform);
    let cost = 0, exec = 0, tokens = 0;
    pa.forEach(a => { cost += a.costs.cost; exec += a.costs.exec; tokens += a.costs.tokens; });
    return { cost, exec, tokens, count: pa.length };
  }

  function aggRole(role) {
    const ra = AGENTS.filter(a => a.role === role);
    let cost = 0, exec = 0;
    ra.forEach(a => { cost += a.costs.cost; exec += a.costs.exec; });
    return { cost, exec, count: ra.length };
  }

  // ================================================================
  // Formatting helpers (EUR, French locale)
  // ================================================================
  function fmtEUR(n) {
    if (n >= 1000000) return '€' + (n / 1000000).toFixed(2) + 'M';
    if (n >= 1000) return '€' + (n / 1000).toFixed(1) + 'k';
    return '€' + n.toLocaleString('en-GB');
  }
  function fmtEURFull(n) {
    return '€' + n.toLocaleString('en-GB');
  }
  function fmtK(n) {
    if (n >= 10000) return (n / 1000).toFixed(0) + 'k';
    if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
    return String(n);
  }
  function fmtTokens(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n / 1000).toFixed(0) + 'k';
    return String(n);
  }
  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  // ================================================================
  // Totals
  // ================================================================
  let totalCost = 0, totalExec = 0, totalTokens = 0;
  AGENTS.forEach(a => {
    totalCost += a.costs.cost;
    totalExec += a.costs.exec;
    totalTokens += a.costs.tokens;
  });
  const avgCostPerExec = totalExec > 0 ? totalCost / totalExec : 0;

  // "Without Solace" costs
  const withoutOrchestration = 4 * 8200;  // 32,800
  const withoutIntegrations  = 6 * 3800;  // 22,800
  const withoutGovernance    = 4 * 4600;  // 18,400
  const withoutFTE           = 2 * 9500;  // 19,000
  const withoutTotal         = withoutOrchestration + withoutIntegrations + withoutGovernance + withoutFTE;

  // "With Solace" costs
  const solacePlatform = 12000;
  const agentCompute   = totalCost;
  const avecTotal      = solacePlatform + agentCompute;

  const savings    = withoutTotal - avecTotal;
  const savingsPct = Math.round((savings / withoutTotal) * 100);
  const roi        = Math.round((savings / avecTotal) * 100);
  const payback    = (avecTotal / savings).toFixed(1);

  // ================================================================
  // RENDER
  // ================================================================
  function render() {
    const content = document.getElementById('content');
    let h = '';

    // ---- Hero Stats ----
    h += '<div class="hero-stats">';
    h += '<div class="stat-card c-amber"><div class="stat-val" style="color:var(--roi-amber)">' + fmtEUR(totalCost) + '</div><div class="stat-lbl">Monthly Cost</div><div class="stat-sub">2,000 agents</div></div>';
    h += '<div class="stat-card c-blue"><div class="stat-val" style="color:var(--roi-blue)">' + fmtK(totalExec) + '</div><div class="stat-lbl">Executions/Month</div><div class="stat-sub">all domains</div></div>';
    h += '<div class="stat-card c-roi"><div class="stat-val" style="color:var(--sol-text)">€' + avgCostPerExec.toFixed(2) + '</div><div class="stat-lbl">Avg. Cost/Execution</div><div class="stat-sub">entire platform</div></div>';
    h += '<div class="stat-card c-green"><div class="stat-val" style="color:var(--sol-green)">' + fmtEUR(savings) + '</div><div class="stat-lbl">Savings vs Silos</div><div class="stat-sub">~' + fmtEUR(savings * 12) + '/yr</div></div>';
    h += '<div class="stat-card c-green"><div class="stat-val" style="color:var(--sol-green)">' + roi + '%</div><div class="stat-lbl">Return on Investment</div><div class="stat-sub">annualized</div></div>';
    h += '<div class="stat-card c-green"><div class="stat-val" style="color:var(--sol-green)">' + payback + ' months</div><div class="stat-lbl">Payback Period</div><div class="stat-sub">break-even</div></div>';
    h += '</div>';

    // ---- Comparison Panel ----
    h += '<div class="section" id="sec-comparison">';
    h += '<div class="section-hdr"><span class="section-title">Platform Comparison</span>';
    h += '<span class="section-sub">&ldquo;With Solace&rdquo; vs &ldquo;Without Solace&rdquo;  -  monthly analysis</span><span class="section-line"></span></div>';
    h += '<div class="comparison">';

    // Sans Solace (left)
    h += '<div class="comp-side without">';
    h += '<div class="comp-title red"><span class="icon">&#x2717;</span> Without Solace</div>';
    h += '<div class="comp-line"><div><div class="comp-line-desc">Separate orchestration tools</div><div class="comp-line-detail">4 platforms &times; &euro;8,200/month</div></div><div class="comp-line-cost red">' + fmtEURFull(withoutOrchestration) + '</div></div>';
    h += '<div class="comp-line"><div><div class="comp-line-desc">Point-to-point integrations</div><div class="comp-line-detail">6 domain pairs &times; &euro;3,800/month</div></div><div class="comp-line-cost red">' + fmtEURFull(withoutIntegrations) + '</div></div>';
    h += '<div class="comp-line"><div><div class="comp-line-desc">Separate governance stacks</div><div class="comp-line-detail">4 stacks &times; &euro;4,600/month</div></div><div class="comp-line-cost red">' + fmtEURFull(withoutGovernance) + '</div></div>';
    h += '<div class="comp-line"><div><div class="comp-line-desc">Integration FTEs</div><div class="comp-line-detail">2 engineers &times; &euro;9,500/month</div></div><div class="comp-line-cost red">' + fmtEURFull(withoutFTE) + '</div></div>';
    h += '<div class="comp-total red"><span class="comp-total-label" style="color:var(--roi-red)">Total Monthly Cost</span><span class="comp-total-val red">' + fmtEURFull(withoutTotal) + '</span></div>';
    h += '</div>';

    // Avec Solace (right)
    h += '<div class="comp-side with">';
    h += '<div class="comp-title green"><span class="icon">&#x2713;</span> With Solace</div>';
    h += '<div class="comp-line"><div><div class="comp-line-desc">Solace Agent Mesh Platform</div><div class="comp-line-detail">Unified event mesh + routing</div></div><div class="comp-line-cost green">' + fmtEURFull(solacePlatform) + '</div></div>';
    h += '<div class="comp-line"><div><div class="comp-line-desc">Agent compute (2,000 agents)</div><div class="comp-line-detail">Databricks + Salesforce + Mistral + Claude</div></div><div class="comp-line-cost green">' + fmtEURFull(agentCompute) + '</div></div>';
    h += '<div class="comp-line"><div><div class="comp-line-desc">Unified governance</div><div class="comp-line-detail">Policy engine, audit, RBAC</div></div><div class="comp-line-cost included">Included</div></div>';
    h += '<div class="comp-line"><div><div class="comp-line-desc">Observability</div><div class="comp-line-detail">Metrics, tracing, cost tracking</div></div><div class="comp-line-cost included">Included</div></div>';
    h += '<div class="comp-total green"><span class="comp-total-label" style="color:var(--sol-green)">Total Monthly Cost</span><span class="comp-total-val green">' + fmtEURFull(avecTotal) + '</span></div>';
    h += '</div>';

    // Savings bar
    h += '<div class="savings-bar">';
    h += '<div class="savings-label">Monthly Savings</div>';
    h += '<div class="savings-track"><div class="savings-fill" style="width:' + savingsPct + '%">' + savingsPct + '% reduction</div></div>';
    h += '<div class="savings-amount">' + fmtEURFull(savings) + '/month</div>';
    h += '</div>';

    h += '</div></div>';

    // ---- Cost by Domain ----
    const domainData = Object.keys(DOMAINS).map(k => ({ key: k, ...DOMAINS[k], ...aggDomain(k) }));
    const maxDomainCost = Math.max(...domainData.map(d => d.cost));

    h += '<div class="section" id="sec-domain">';
    h += '<div class="section-hdr"><span class="section-title">Cost by Domain</span><span class="section-sub">Monthly compute cost per business domain</span><span class="section-line"></span></div>';
    h += '<div class="h-bar-group">';
    domainData.forEach(d => {
      const pct = Math.round((d.cost / totalCost) * 100);
      const barW = Math.round((d.cost / maxDomainCost) * 100);
      h += '<div class="h-bar-item">';
      h += '<div class="h-bar-label"><div class="h-bar-label-name">' + esc(d.full) + '<span class="platform-badge ' + d.platform + '">' + esc(d.platform) + '</span></div><div class="h-bar-label-sub">' + d.count + ' agents</div></div>';
      h += '<div class="h-bar-track"><div class="h-bar-fill ' + d.platform + '" style="width:' + barW + '%">' + fmtEUR(d.cost) + '</div></div>';
      h += '<div class="h-bar-meta"><div class="h-bar-cost">' + fmtEUR(d.cost) + '</div><div class="h-bar-pct">' + pct + '% of total</div></div>';
      h += '</div>';
    });
    h += '</div></div>';

    // ---- Cost by Platform ----
    const platKeys = ['databricks', 'salesforce', 'mistral', 'claude'];
    const platData = platKeys.map(k => ({ key: k, label: PLAT_LABELS[k], ...aggPlatform(k) }));
    const maxPlatCost = Math.max(...platData.map(p => p.cost));

    h += '<div class="section" id="sec-platform">';
    h += '<div class="section-hdr"><span class="section-title">Cost by Platform</span><span class="section-sub">Aggregated by AI provider</span><span class="section-line"></span></div>';
    h += '<div class="h-bar-group">';
    platData.forEach(p => {
      const pct = Math.round((p.cost / totalCost) * 100);
      const barW = Math.round((p.cost / maxPlatCost) * 100);
      h += '<div class="h-bar-item">';
      h += '<div class="h-bar-label"><div class="h-bar-label-name">' + esc(p.label) + '</div><div class="h-bar-label-sub">' + p.count + ' agents &middot; ' + fmtTokens(p.tokens) + ' tokens</div></div>';
      h += '<div class="h-bar-track"><div class="h-bar-fill ' + p.key + '" style="width:' + barW + '%">' + fmtEUR(p.cost) + '</div></div>';
      h += '<div class="h-bar-meta"><div class="h-bar-cost">' + fmtEUR(p.cost) + '</div><div class="h-bar-pct">' + pct + '%</div></div>';
      h += '</div>';
    });
    h += '</div></div>';

    // ---- Cost by Agent Type ----
    const roleData = [
      { key: 'orchestrator', label: 'Orchestrator', sub: '1 agent', ...aggRole('orchestrator') },
      { key: 'head', label: 'Domain Heads', sub: '4 agents', ...aggRole('head') },
      { key: 'specialist', label: 'Specialists', sub: '16 agents', ...aggRole('specialist') },
    ];
    const maxRoleCost = Math.max(...roleData.map(r => r.cost));
    const roleColors = { orchestrator: 'green', head: 'blue', specialist: 'amber' };

    h += '<div class="section" id="sec-type">';
    h += '<div class="section-hdr"><span class="section-title">Cost by Agent Type</span><span class="section-sub">Hierarchical distribution</span><span class="section-line"></span></div>';
    h += '<div class="h-bar-group">';
    roleData.forEach(r => {
      const pct = Math.round((r.cost / totalCost) * 100);
      const barW = Math.max(5, Math.round((r.cost / maxRoleCost) * 100));
      h += '<div class="h-bar-item">';
      h += '<div class="h-bar-label"><div class="h-bar-label-name">' + esc(r.label) + '</div><div class="h-bar-label-sub">' + r.sub + '</div></div>';
      h += '<div class="h-bar-track"><div class="h-bar-fill ' + roleColors[r.key] + '" style="width:' + barW + '%">' + fmtEUR(r.cost) + '</div></div>';
      h += '<div class="h-bar-meta"><div class="h-bar-cost">' + fmtEUR(r.cost) + '</div><div class="h-bar-pct">' + pct + '%</div></div>';
      h += '</div>';
    });
    h += '</div></div>';

    // ---- 6-Month Cost Trend ----
    const months = ['Nov 2025', 'Dec 2025', 'Jan 2026', 'Feb 2026', 'Mar 2026', 'Apr 2026'];
    const totals = [22000, 20200, 18500, 17100, 16000, totalCost];
    const maxTrend = Math.max(...totals);

    h += '<div class="section">';
    h += '<div class="section-hdr"><span class="section-title">6-Month Trend</span><span class="section-sub">Optimization trajectory from Nov 2025 to Apr 2026</span><span class="section-line"></span></div>';
    h += '<div class="trend-chart">';
    totals.forEach((t, i) => {
      const govPct = 0.12 - i * 0.01;
      const tokenPct = 0.45 - i * 0.02;
      const computePct = 1 - govPct - tokenPct;
      const totalH = Math.round((t / maxTrend) * 160);
      const compH = Math.round(computePct * totalH);
      const tokH = Math.round(tokenPct * totalH);
      const govH = totalH - compH - tokH;
      h += '<div class="trend-bar-group">';
      h += '<div class="trend-val">' + fmtEUR(t) + '</div>';
      h += '<div class="trend-bar-stack" style="height:' + totalH + 'px">';
      h += '<div class="trend-seg compute" style="height:' + compH + 'px"></div>';
      h += '<div class="trend-seg tokens" style="height:' + tokH + 'px"></div>';
      h += '<div class="trend-seg gov" style="height:' + govH + 'px"></div>';
      h += '</div>';
      h += '<div class="trend-month">' + months[i] + '</div>';
      h += '</div>';
    });
    h += '</div>';
    h += '<div class="trend-legend">';
    h += '<div class="trend-legend-item"><div class="trend-legend-dot" style="background:var(--roi-blue)"></div>Compute</div>';
    h += '<div class="trend-legend-item"><div class="trend-legend-dot" style="background:var(--roi-amber)"></div>Tokens</div>';
    h += '<div class="trend-legend-item"><div class="trend-legend-dot" style="background:var(--sol-green)"></div>Governance</div>';
    h += '</div></div>';

    // ---- Top Agents by Cost (table, 10 rows) ----
    const sortedAgents = [...AGENTS].sort((a, b) => b.costs.cost - a.costs.cost).slice(0, 10);

    h += '<div class="section" id="sec-top-agents">';
    h += '<div class="section-hdr"><span class="section-title">Top 10 Agents by Cost</span><span class="section-sub">Sorted by monthly cost descending</span><span class="section-line"></span></div>';
    h += '<div style="overflow-x:auto"><table class="util-table"><thead><tr>';
    h += '<th>Agent</th><th>Domain</th><th>Platform</th><th>Cost/Month</th><th>Exec/Month</th><th>Cost/Exec</th><th>Success Rate</th><th>Efficiency</th>';
    h += '</tr></thead><tbody>';

    sortedAgents.forEach(a => {
      const domainLabel = a.domain === 'orchestrator' ? 'Orchestrator' : (DOMAINS[a.domain]?.label || a.domain);
      const platLabel = PLAT_LABELS[a.platform] || a.platform;
      const isExpensive = a.costs.cost > 500;
      const costColor = isExpensive ? 'color:var(--roi-amber)' : '';
      const effClass = a.costs.efficiency === 'Excellent' ? 'green' : 'amber';

      h += '<tr>';
      h += '<td><div style="font-weight:600">' + esc(a.name) + '</div><div class="mono">' + esc(a.id) + '</div></td>';
      h += '<td>' + esc(domainLabel) + '</td>';
      h += '<td><span class="platform-badge ' + a.platform + '">' + esc(platLabel) + '</span></td>';
      h += '<td style="font-weight:700;' + costColor + '">' + fmtEURFull(a.costs.cost) + '</td>';
      h += '<td style="font-weight:600">' + a.costs.exec.toLocaleString('en-GB') + '</td>';
      h += '<td style="font-weight:600">' + a.costs.costPerExec.toFixed(2) + ' €</td>';
      h += '<td>' + a.costs.successRate.toFixed(1) + '%</td>';
      h += '<td><span class="badge-status ' + effClass + '">' + a.costs.efficiency + '</span></td>';
      h += '</tr>';
    });

    h += '</tbody></table></div></div>';

    // ---- ROI Summary ----
    const annualInvestment = avecTotal * 12;
    const annualSavings = savings * 12;
    const netBenefit = annualSavings;

    h += '<div class="section">';
    h += '<div class="section-hdr"><span class="section-title">ROI Summary</span><span class="section-sub">Annual financial impact of Solace Agent Mesh deployment</span><span class="section-line"></span></div>';
    h += '<div class="roi-summary">';
    h += '<div class="roi-col"><div class="roi-col-label">Annual Investment</div><div class="roi-col-val" style="color:var(--roi-amber)">' + fmtEUR(annualInvestment) + '</div><div class="roi-col-sub">' + fmtEURFull(avecTotal) + '/month &times; 12</div></div>';
    h += '<div class="roi-arrow">&#x2192;</div>';
    h += '<div class="roi-col"><div class="roi-col-label">Annual Savings</div><div class="roi-col-val" style="color:var(--sol-green)">' + fmtEUR(annualSavings) + '</div><div class="roi-col-sub">' + fmtEURFull(savings) + '/month &times; 12</div></div>';
    h += '<div class="roi-arrow">&#x2192;</div>';
    h += '<div class="roi-col"><div class="roi-col-label">Net Benefit (Annual)</div><div class="roi-col-val" style="color:var(--sol-green)">' + fmtEUR(netBenefit) + '</div><div class="roi-col-sub">Payback in ' + payback + ' months</div></div>';
    h += '<div class="roi-progress"><div class="roi-progress-label"><span>Payback trajectory</span><span style="color:var(--sol-green);font-weight:700">' + payback + ' months to break-even</span></div>';
    h += '<div class="roi-progress-track"><div class="roi-progress-fill" style="width:' + Math.min(100, Math.round((1 / parseFloat(payback)) * 100 * 12)) + '%"></div></div></div>';
    h += '</div></div>';

    content.innerHTML = h;
  }

  // ================================================================
  // Sidebar
  // ================================================================
  function renderSidebar() {
    let s = '<div class="sb-hdr"><h3>Cost Navigator</h3></div><div class="sb-body">';

    // Views
    s += '<div class="sb-sec">Sections</div>';
    s += '<button class="sb-btn" onclick="document.getElementById(\'sec-comparison\').scrollIntoView({behavior:\'smooth\'})"><span class="sb-dot" style="background:var(--sol-green)"></span>Comparison</button>';
    s += '<button class="sb-btn" onclick="document.getElementById(\'sec-domain\').scrollIntoView({behavior:\'smooth\'})"><span class="sb-dot" style="background:var(--roi-amber)"></span>By Domain</button>';
    s += '<button class="sb-btn" onclick="document.getElementById(\'sec-platform\').scrollIntoView({behavior:\'smooth\'})"><span class="sb-dot" style="background:var(--roi-blue)"></span>By Platform</button>';
    s += '<button class="sb-btn" onclick="document.getElementById(\'sec-top-agents\').scrollIntoView({behavior:\'smooth\'})"><span class="sb-dot" style="background:var(--databricks)"></span>Top Agents</button>';

    // Domain cost mini bars
    s += '<div class="sb-sec">Cost by Domain</div>';
    const domainData = Object.keys(DOMAINS).map(k => ({ key: k, ...DOMAINS[k], ...aggDomain(k) }));
    const maxDomain = Math.max(...domainData.map(d => d.cost));
    domainData.forEach(d => {
      const barW = Math.round((d.cost / maxDomain) * 100);
      s += '<div class="sb-bar-row"><span class="sb-bar-label">' + esc(d.label) + '</span>';
      s += '<div class="sb-bar-track"><div class="sb-bar-fill" style="width:' + barW + '%;background:var(--' + d.platform + ')"></div></div>';
      s += '<span class="sb-bar-val">' + fmtEUR(d.cost) + '</span></div>';
    });

    // Platform cost mini bars
    s += '<div class="sb-sec">Cost by Platform</div>';
    const platKeys = ['databricks', 'salesforce', 'mistral', 'claude'];
    const platData = platKeys.map(k => ({ key: k, label: PLAT_LABELS[k], ...aggPlatform(k) }));
    const maxPlat = Math.max(...platData.map(p => p.cost));
    platData.forEach(p => {
      const barW = Math.round((p.cost / maxPlat) * 100);
      s += '<div class="sb-bar-row"><span class="sb-bar-label">' + esc(p.label) + '</span>';
      s += '<div class="sb-bar-track"><div class="sb-bar-fill" style="width:' + barW + '%;background:var(--' + p.key + ')"></div></div>';
      s += '<span class="sb-bar-val">' + fmtEUR(p.cost) + '</span></div>';
    });

    // Type cost mini bars
    s += '<div class="sb-sec">Cost by Type</div>';
    const roleData = [
      { key: 'orchestrator', label: 'Orchestrator', ...aggRole('orchestrator') },
      { key: 'head', label: 'Domain Heads', ...aggRole('head') },
      { key: 'specialist', label: 'Specialists', ...aggRole('specialist') },
    ];
    const maxRole = Math.max(...roleData.map(r => r.cost));
    roleData.forEach(r => {
      const barW = Math.max(5, Math.round((r.cost / maxRole) * 100));
      s += '<div class="sb-bar-row"><span class="sb-bar-label">' + esc(r.label) + '</span>';
      s += '<div class="sb-bar-track"><div class="sb-bar-fill" style="width:' + barW + '%;background:var(--sol-green)"></div></div>';
      s += '<span class="sb-bar-val">' + fmtEUR(r.cost) + '</span></div>';
    });

    // ROI Summary
    s += '<div class="sb-roi-summary" style="margin-top:12px">';
    s += '<div class="sb-roi-row"><span class="sb-roi-label">Total Cost</span><span class="sb-roi-val amber">' + fmtEUR(avecTotal) + '</span></div>';
    s += '<div class="sb-roi-row"><span class="sb-roi-label">Savings</span><span class="sb-roi-val">' + fmtEUR(savings) + '/month</span></div>';
    s += '<div class="sb-roi-row"><span class="sb-roi-label">ROI</span><span class="sb-roi-val">' + roi + '%</span></div>';
    s += '<div class="sb-roi-row"><span class="sb-roi-label">Payback</span><span class="sb-roi-val">' + payback + ' months</span></div>';
    s += '</div>';

    s += '</div>';
    document.getElementById('sidebar').innerHTML = s;
  }

  // ================================================================
  // Init
  // ================================================================
  document.addEventListener('DOMContentLoaded', function() {
    renderSidebar();
    render();
  });

})();
</script>
</body>
</html>
